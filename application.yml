spring:
  application:
    name: items

  config:
    import: "optional:configserver:http://localhost:8090"


eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"



management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true